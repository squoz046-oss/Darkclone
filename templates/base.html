<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Market</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #0d0d0d; color: #c0c0c0; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        .header { background: #1a1a1a; padding: 15px 20px; border-bottom: 2px solid #2a7a2a; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header a { color: #7fff7f; text-decoration: none; margin: 0 10px; }
        .header a:hover { color: #fff; }
        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .product-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .product-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            max-width: 220px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .product-card img {
            width: 100%;
            height: 100px;
            object-fit: contain;
            background: #111;
            border-radius: 4px;
        }
        .btn { background: #2a7a2a; color: #fff; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; font-size: 14px; }
        .btn:hover { background: #3a9a3a; }
        .cart-badge { background: #c0392b; color: #fff; border-radius: 50%; padding: 2px 8px; font-size: 12px; }
        .footer { text-align: center; padding: 20px; color: #555; font-size: 12px; border-top: 1px solid #222; margin-top: 30px; }
        input, textarea { background: #1a1a1a; color: #c0c0c0; border: 1px solid #333; padding: 8px; border-radius: 4px; width: 100%; max-width: 300px; margin: 5px 0; }
        form { max-width: 400px; margin: 0 auto; }
        .logo { height: 50px; vertical-align: middle; margin-right: 15px; }  /* PIÙ GRANDE */
        .badge-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            background: #1a1a1a;
            padding: 30px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #2a2a2a;
        }
        .badge-item {
            flex: 1 1 180px;
            max-width: 220px;
            text-align: center;
        }
        .badge-item h4 {
            color: #7fff7f;
            margin: 8px 0 6px;
            font-size: 15px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .badge-item p {
            color: #aaa;
            font-size: 13px;
            line-height: 1.6;
            margin: 5px 0 0;
        }
        /* RESPONSIVE: su mobile 3 colonne (per larghezza >= 400px) */
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: stretch; text-align: center; }
            .header div { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
            .product-grid { gap: 10px; }
            .product-card {
                width: calc(33.33% - 7px);
                max-width: none;
                padding: 8px;
            }
            .product-card h4 {
                font-size: 12px;
                margin: 4px 0 2px;
            }
            .product-card p {
                font-size: 11px;
                margin: 2px 0;
            }
            .product-card .btn {
                font-size: 11px;
                padding: 4px 8px;
                margin: 1px;
            }
            .badge-grid {
                padding: 20px 10px;
                gap: 15px;
            }
            .badge-item {
                flex: 1 1 100%;
                max-width: 100%;
            }
            .logo { height: 40px; } /* Adatto per mobile, ma più grande di prima */
        }
        /* Per schermi medi (tablet) */
        @media (min-width: 601px) and (max-width: 900px) {
            .product-card { width: calc(33.33% - 10px); max-width: none; }
        }
        /* Per schermi più piccoli (under 400px) – 2 colonne per non schiacciare */
        @media (max-width: 399px) {
            .product-card { width: calc(50% - 5px); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('cart') }}">🛒 Cart <span class="cart-badge">{{ session.get('cart', [])|length }}</span></a>
        </div>
        <div>
            {% if session.username %}
                <span>Hello, {{ session.username }}</span>
                <a href="{{ url_for('logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('login') }}">Login</a>
                <a href="{{ url_for('register') }}">Register</a>
            {% endif %}
        </div>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <div class="footer">Secure transactions with crypto payments.</div>
</body>
</html>
